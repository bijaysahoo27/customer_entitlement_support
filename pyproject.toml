[project]
name = "customer-entitlement-support"
version = "0.1.0"
description = "Customer entitlements, usage, and support case API"
readme = "README.md"
authors = [
    { name = "Bijay sahoo", email = "bijaysahoo27@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx",
    "psycopg[binary]==3.2.13",
    "pyjwt[crypto]",
    "pyyaml==6.0.3",
    "uvicorn",
]

[project.scripts]
customer-entitlement-support = "customer_entitlement_support:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_entitlement_support"]

[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "customer_entitlement_support/openapi.yaml"
